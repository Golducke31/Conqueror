name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: lint + typecheck + test + build + mapa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Sin `version`: la version la fija `packageManager` del package.json.
        # Pasar las dos da "Multiple versions of pnpm specified" y rompe el job.
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Datos crudos del mapa
        run: pnpm map:fetch

      - name: Construir mapa
        run: pnpm map:build

      - name: Validar mapa
        run: pnpm map:validate

      - name: Build del cliente
        run: pnpm build

      - name: Navegador de los smokes
        run: npx playwright install --with-deps chromium

      - name: Smoke de pantallas
        run: pnpm smoke

      - name: Smoke de partida local
        run: pnpm smoke:match
        timeout-minutes: 10

      - name: Smoke de partida online
        run: pnpm smoke:online
        timeout-minutes: 10
