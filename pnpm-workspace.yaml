packages:
  - 'apps/*'
  - 'packages/*'

# pnpm bloquea los scripts de postinstall por defecto (desde v10).
# esbuild los necesita para verificar/enlazar su binario nativo, y Vite lo usa.
# msgpackr-extract (dependencia de Colyseus) construye su binario nativo para
# acelerar la codificacion del protocolo; sin el, cae a JS puro, pero pnpm 11
# corta el install con builds ignorados.
allowBuilds:
  esbuild: true
  msgpackr-extract: true

# Excepciones al enfriamiento de versiones recien publicadas.
minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@5.0.5'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - lenis@1.3.27
  - vitest@5.0.5
